<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Filter Scanner</title>
    <!-- Injecting the official production-grade TensorFlow.js distribution package via unpkg CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; background: #f5f7fa; padding: 20px; color: #333; }
        .container { max-width: 450px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { font-size: 26px; margin-bottom: 8px; color: #111; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        .btn-upload { background: #0071e3; color: white; padding: 16px 24px; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; width: 100%; transition: background 0.2s; }
        .btn-upload:hover { background: #0077ed; }
        #imagePreview { max-width: 100%; max-height: 280px; display: none; margin: 25px auto 0; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #status { margin-top: 20px; font-size: 14px; color: #888; font-weight: 500; }
        #result-box { margin-top: 25px; padding: 20px; border-radius: 14px; display: none; text-align: left; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .result-title { font-size: 20px; font-weight: 700; margin: 0 0 12px 0; }
        .result-text { font-size: 14px; margin: 8px 0; line-height: 1.6; }
        .clean { background: #e6f7ed; color: #137333; border: 1px solid #c3e6cb; }
        .dirty { background: #fef7e0; color: #b06000; border: 1px solid #ffeeba; }
        .moldy { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Máy Quét Lưới Lọc AC</h1>
    <div class="subtitle">Ứng dụng AI phân tích sức khỏe và tuổi thọ bộ lọc không khí</div>
    
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">📸 Chụp Hoặc Tải Ảnh Lưới Lọc</button>
    
    <img id="imagePreview" alt="Preview">
    
    <div id="status">⏳ Đang nạp hệ thống trí tuệ nhân tạo...</div>
    
    <div id="result-box">
        <p class="result-title" id="resCondition">Kết quả: </p>
        <p class="result-text"><strong>Tuổi thọ dự kiến:</strong> <span id="resLifespan"></span></p>
        <p class="result-text"><strong>Khuyến nghị từ AI:</strong> <span id="resRecommend"></span></p>
    </div>
</div>

<script>
    let model;
    const CATEGORIES = ["Clean", "Dirty", "Moldy"]; 

    async function initApp() {
        if (typeof tf === 'undefined') {
            document.getElementById('status').innerText = "❌ Lỗi: Không thể kết nối với thư viện TensorFlow.js từ mạng Internet.";
            return;
        }
        
        document.getElementById('status').innerText = "⏳ Đang kết nối mô hình tệp mạng...";
        try {
            // Chỉ đường dẫn trực tiếp tới file model.json lưu trong thư mục models của bạn
            model = await tf.loadLayersModel('./models/model.json');
            document.getElementById('status').innerText = "✅ AI đã sẵn sàng! Hãy chọn ảnh quét bộ lọc.";
        } catch (error) {
            document.getElementById('status').innerText = "❌ Lỗi: Không tìm thấy tệp 'model.json' bên trong thư mục 'models'.";
            console.error(error);
        }
    }

    // Tự động kích hoạt nạp ứng dụng sau khi giao diện dựng xong
    window.addEventListener('DOMContentLoaded', initApp);

       // Robust file input event listener featuring array validation and single-file stream targeting
    document.getElementById('fileInput').addEventListener('change', function(e) {
        // Enforcing array check and ensuring at least one valid data stream exists in the buffer
        if (!e.target.files || e.target.files.length === 0) {
            document.getElementById('status').innerText = "⚠️ Validation Error: No file sequence detected in input stream.";
            return;
        }

        // Directing the target memory mapping to extract only the first discrete file block (index 0)
        const targetFile = e.target.files[0];

        const reader = new FileReader();
        reader.onload = function(event) {
            const imgElement = document.getElementById('imagePreview');
            imgElement.src = event.target.result;
            imgElement.style.display = 'block';
            document.getElementById('status').innerText = " Activating edge convolution grids and mapping image bitstreams...";
            
            imgElement.onload = async () => {
                if (!model) return;
                await runInference(imgElement);
            };
        }
        
        // Safely executing data serialization on the validated single-file object parameter
        reader.readAsDataURL(targetFile);
    });


    async function runInference(imgElement) {
        let tensor = tf.browser.fromPixels(imgElement)
            .resizeNearestNeighbor([224, 224]) // Ép kích thước ảnh khớp chuẩn đầu vào 224x224
            .toFloat()
            .div(tf.scalar(255.0)) 
            .expandDims();

        const predictions = await model.predict(tensor).data();
        const maxIndex = predictions.indexOf(Math.max(...predictions));
        updateUI(CATEGORIES[maxIndex]);
    }

    function updateUI(condition) {
        document.getElementById('status').innerText = "✨ Phân tích hoàn tất!";
        const box = document.getElementById('result-box');
        box.className = ""; 
        box.style.display = "block";

        if (condition === "Clean") {
            box.classList.add("clean");
            document.getElementById('resCondition').innerText = "Kết quả: Sạch Sẽ 🟢";
            document.getElementById('resLifespan').innerText = "Còn lại khoảng 60 - 90 ngày sử dụng.";
            document.getElementById('resRecommend').innerText = "Hệ thống lọc khí đang ở trạng thái tối ưu. Không cần vệ sinh.";
        } else if (condition === "Dirty") {
            box.classList.add("dirty");
            document.getElementById('resCondition').innerText = "Kết quả: Bám Bẩn Nhiều 🟡";
            document.getElementById('resLifespan').innerText = "0 ngày (Hiệu suất giảm sâu).";
            document.getElementById('resRecommend').innerText = "Lớp bụi bám dày đang gây cản gió. Hãy tháo lưới lọc ra rửa sạch.";
        } else {
            box.classList.add("moldy");
            document.getElementById('resCondition').innerText = "Kết quả: Nhiễm Nấm Mốc 🔴 NGUY HIỂM";
            document.getElementById('resLifespan').innerText = "0 ngày (Cảnh báo an toàn hô hấp).";
            document.getElementById('resRecommend').innerText = "Phát hiện bào tử nấm mốc có hại. Hãy đeo khẩu trang và tháo bỏ lưới.";
        }
    }
</script>
</body>
</html>
