<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AC Filter Scanner - Core Functional Only</title>
  
  <!-- Tải TensorFlow.js trực tiếp từ CDN chuẩn -->
  <script src="https://jsdelivr.net"></script>
</head>
<body>

  <h1>AC Filter Scanner</h1>
  
  <!-- KHU VỰC TRẠNG THÁI & ĐIỀU KHIỂN -->
  <div>
    <strong>Trạng thái hệ thống:</strong> <span id="status">Đang tải mô hình AI...</span>
  </div>
  <br>
  
  <!-- Nút chọn file ảnh (Mặc định ẩn, chỉ hiện khi AI tải xong) -->
  <input type="file" id="imageLoader" accept="image/*" disabled />
  <br><br>

  <!-- Khu vực hiển thị ảnh đã upload và kết quả phân tích -->
  <img id="previewImage" style="max-width: 300px; display: none;" alt="Preview" />
  
  <h3>Kết quả phân tích từ AI:</h3>
  <pre id="output" style="background: #f0f0f0; padding: 10px;">Chờ upload ảnh...</pre>

  <!-- KHU VỰC XỬ LÝ LOGIC JAVASCRIPT -->
  <script>
    // 1. Sửa lỗi hệ thống: Định nghĩa và đăng ký hàm kích hoạt 'hardSilu'
    class HardSiLU extends tf.layers.Layer {
      constructor() { super({}); }
      static get className() { return 'hardSilu'; }
      call(inputs) {
        return tf.tidy(() => {
          const x = inputs;
          return x.mul(tf.clipByValue(x.add(3), 0, 6).div(6));
        });
      }
      computeOutputShape(inputShape) { return inputShape; }
    }
    tf.serialization.registerClass(HardSiLU);

    // Biến toàn cục lưu trữ mô hình sau khi tải xong
    let model;

    // 2. Hàm tải mô hình AI khi vừa mở trang web
    async function loadAIModel() {
      const statusElement = document.getElementById('status');
      const fileInput = document.getElementById('imageLoader');
      
      try {
        // Tải file mô hình từ thư mục cục bộ của bạn
        model = await tf.loadLayersModel('./models/model.json');
        
        statusElement.innerText = "Mô hình đã sẵn sàng! Hãy upload ảnh.";
        statusElement.style.color = "green";
        fileInput.disabled = false; // Kích hoạt nút chọn ảnh
      } catch (error) {
        statusElement.innerText = "Lỗi không thể tải mô hình AI. Kiểm tra lại đường dẫn './models/model.json'.";
        statusElement.style.color = "red";
        console.error(error);
      }
    }

    // 3. Hàm xử lý khi người dùng chọn/upload ảnh
    document.getElementById('imageLoader').addEventListener('change', function(e) {
      const reader = new FileReader();
      
      reader.onload = function(event) {
        const imgElement = document.getElementById('previewImage');
        imgElement.src = event.target.result;
        imgElement.style.display = "block";
        
        // Chờ ảnh load xong vào thẻ <img> rồi tiến hành phân tích
        imgElement.onload = async function() {
          document.getElementById('output').innerText = "AI đang phân tích dữ liệu ảnh...";
          await runInference(imgElement);
        };
      };
      
      if(e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    // 4. Hàm đưa ảnh vào mô hình AI và lấy kết quả đầu ra
    async function runInference(imgElement) {
      if (!model) {
        alert("Mô hình chưa được tải thành công!");
        return;
      }

      tf.tidy(() => {
        // Chuyển đổi hình ảnh thành Tensor phù hợp với đầu vào của mô hình
        // Giả định mô hình của bạn nhận ảnh RGB kích thước 224x224 (hoặc thay đổi theo mô hình của bạn, ví dụ: 640x640 cho YOLO)
        let tensor = tf.browser.fromPixels(imgElement)
          .resizeNearestNeighbor([224, 224]) // <-- THAY ĐỔI KÍCH THƯỚC NÀY CHO ĐÚNG VỚI MÔ HÌNH CỦA BẠN
          .toFloat()
          .div(tf.scalar(255.0)) // Chuẩn hóa giá trị pixel về khoảng [0, 1]
          .expandDims(0); // Thêm chiều batch (batch size = 1)

        // Thực hiện dự đoán
        const predictions = model.predict(tensor);
        
        // Lấy dữ liệu mảng kết quả từ Tensor đầu ra
        const outputData = predictions.dataSync();
        
        // Hiển thị kết quả thô lên màn hình
        document.getElementById('output').innerText = JSON.stringify(Array.from(outputData), null, 2);
        console.log("Kết quả từ AI:", outputData);
      });
    }

    // Tự động chạy hàm tải mô hình ngay khi trang web mở ra
    loadAIModel();
  </script>
</body>
</html>
