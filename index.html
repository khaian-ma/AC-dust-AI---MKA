<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI AC Filter Diagnostics</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; background: #f5f7fa; padding: 20px; color: #333; }
        .container { max-width: 450px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { font-size: 26px; margin-bottom: 8px; color: #111; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        .btn-upload { background: #0071e3; color: white; padding: 16px 24px; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; width: 100%; transition: background 0.2s; }
        .btn-upload:hover { background: #0077ed; }
        #imagePreview { max-width: 100%; max-height: 280px; display: none; margin: 25px auto 0; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #status { margin-top: 20px; font-size: 14px; color: #888; font-weight: 500; }
        #result-box { margin-top: 25px; padding: 20px; border-radius: 14px; display: none; text-align: left; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .result-title { font-size: 20px; font-weight: 700; margin: 0 0 12px 0; }
        .result-text { font-size: 14px; margin: 8px 0; line-height: 1.6; }
        .clean { background: #e6f7ed; color: #137333; border: 1px solid #c3e6cb; }
        .dirty { background: #fef7e0; color: #b06000; border: 1px solid #ffeeba; }
        .moldy { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 AC Filter Scanner</h1>
    <div class="subtitle">Edge AI Diagnostic Web Application for HVAC Filter Condition Evaluation</div>
    
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
    <button class="btn-upload" id="uploadBtn" disabled style="background: #ccc; cursor: not-allowed;">📸 Loading System Assets...</button>
    
    <img id="imagePreview" alt="Filter Preview">
    
    <div id="status">⏳ Initializing Deep Learning Core Component...</div>
    
    <div id="result-box">
        <p class="result-title" id="resCondition">Diagnostic Result: </p>
        <p class="result-text"><strong>Estimated Lifespan:</strong> <span id="resLifespan"></span></p>
        <p class="result-text"><strong>AI Recommended Action:</strong> <span id="resRecommend"></span></p>
    </div>
</div>

<!-- Combined ES Module Execution Framework to completely resolve CORS, CSP, and variable scoping conflicts -->
<script type="module">
    // Direct modular package fetch via highly available production mirrors
    import * as tf from 'https://jsdelivr.net';
    
    let model;
    const CATEGORIES = ["Clean", "Dirty", "Moldy"]; 

    async function initApp() {
        document.getElementById('status').innerText = "⏳ Streaming deep learning model layers...";
        try {
            // Ép trình duyệt gọi trực tiếp bằng liên kết HTTPS bảo mật tuyệt đối của máy chủ GitHub
            model = await tf.loadLayersModel('https://githubusercontent.com');
            
            // Unlocking interface controls instantly upon absolute successful execution mapping

            
            // Unlocking interface controls instantly upon absolute successful execution mapping
            const btn = document.getElementById('uploadBtn');
            btn.disabled = false;
            btn.style.background = "#0071e3";
            btn.style.cursor = "pointer";
            btn.innerText = "📸 Capture / Upload Filter Image";
            btn.onclick = () => document.getElementById('fileInput').click();
            
            document.getElementById('status').innerText = "✅ Edge AI Engine is online. System ready for diagnostic scan.";
        } catch (error) {
            document.getElementById('status').innerText = "❌ IO Error: Failed to resolve model assets in target folder.";
            console.error(error);
        }
    }

    // Direct initialization invocation inside the secure module thread execution layer
    initApp();

    document.getElementById('fileInput').addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) {
            document.getElementById('status').innerText = "⚠️ Validation Error: No file sequence detected.";
            return;
        }

        const targetFile = e.target.files[0];
        const reader = new FileReader();
        
        reader.onload = function(event) {
            const imgElement = document.getElementById('imagePreview');
            imgElement.src = event.target.result;
            imgElement.style.display = 'block';
            document.getElementById('status').innerText = "⚡ Activating edge convolution grids and mapping image bitstreams...";
            
            imgElement.onload = async () => {
                if (!model) return;
                await runInference(imgElement);
            };
        }
        reader.readAsDataURL(targetFile);
    });

    async function runInference(imgElement) {
        // Enforcing mathematical transform mappings to construct standardized input tensors
        let tensor = tf.browser.fromPixels(imgElement)
            .resizeNearestNeighbor([224, 224]) 
            .toFloat()
            .div(tf.scalar(255.0)) 
            .expandDims();

        const predictions = await model.predict(tensor).data();
        const maxIndex = predictions.indexOf(Math.max(...predictions));
        updateUI(CATEGORIES[maxIndex]);
    }

    function updateUI(condition) {
        document.getElementById('status').innerText = "✨ Execution Pipeline Complete!";
        const box = document.getElementById('result-box');
        box.className = ""; 
        box.style.display = "block";

        if (condition === "Clean") {
            box.classList.add("clean");
            document.getElementById('resCondition').innerText = "Status: Clean 🟢";
            document.getElementById('resLifespan').innerText = "60 to 90 operational days remaining.";
            document.getElementById('resRecommend').innerText = "The filtration layout is operating at peak energy efficiency. Regular structural baseline checks recommended in 30 days.";
        } else if (condition === "Dirty") {
            box.classList.add("dirty");
            document.getElementById('resCondition').innerText = "Status: Heavy Accumulation 🟡";
            document.getElementById('resLifespan').innerText = "0 days (Airflow rate significantly bottlenecked).";
            document.getElementById('resRecommend').innerText = "Accumulated particulate obstructions identified. Mechanical wash or filtration module exchange highly advised.";
        } else {
            box.classList.add("moldy");
            document.getElementById('resCondition').innerText = "Status: Biological Contamination 🔴 HAZARD";
            document.getElementById('resLifespan').innerText = "0 days (Critical interior respiratory safety advisory).";
            document.getElementById('resRecommend').innerText = "Active mold spores/pathogens identified on surface area meshes. Immediate disposal required. Clean cabinets before deploying replacements.";
        }
    }
</script>
</body>
</html>
