name: Rebuild TensorFlow.js model

on:
  push:
    branches: [main]
    paths:
      - "models/ac_filter_model.keras"
      - ".github/workflows/rebuild-tfjs-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TensorFlow and TensorFlow.js converter
        run: |
          python -m pip install --upgrade pip
          python -m pip install tensorflow==2.16.1 tensorflowjs==4.22.0 h5py

      - name: Verify source Keras model can run
        run: |
          mkdir -p build
          python - <<'PY'
          import tensorflow as tf

          model = tf.keras.models.load_model(
              "models/ac_filter_model.keras",
              compile=False,
          )

          x = tf.zeros((1, 224, 224, 3), dtype=tf.float32)
          y = model(x, training=False)

          if y.shape.rank != 2 or y.shape[-1] != 3:
              raise SystemExit(f"Unexpected output shape: {y.shape}")

          model.save("build/model.h5", include_optimizer=False)
          print("SOURCE MODEL TEST PASSED")
          print("Input:", model.input_shape)
          print("Output:", y.shape)
          PY

      - name: Convert Keras model to TensorFlow.js
        run: |
          rm -rf build/tfjs
          tensorflowjs_converter             --input_format=keras             --output_format=tfjs_layers_model             build/model.h5             build/tfjs

      - name: Validate converted model package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/tfjs")
          manifest = json.loads((root / "model.json").read_text())

          dtype_bytes = {
              "float32": 4,
              "float16": 2,
              "int32": 4,
              "uint8": 1,
              "uint16": 2,
              "bool": 1,
          }

          expected = 0
          actual = 0

          for group in manifest["weightsManifest"]:
              for spec in group["weights"]:
                  n = 1
                  for dim in spec["shape"]:
                      n *= dim

                  storage_dtype = spec.get(
                      "quantization", {}
                  ).get("dtype", spec["dtype"])

                  expected += n * dtype_bytes[storage_dtype]

              for rel_path in group["paths"]:
                  shard = root / rel_path
                  if not shard.is_file():
                      raise SystemExit(f"Missing shard: {rel_path}")
                  actual += shard.stat().st_size

          if expected != actual:
              raise SystemExit(
                  f"Weight-size mismatch: manifest expects {expected} bytes, "
                  f"but shards contain {actual} bytes"
              )

          print("TFJS PACKAGE TEST PASSED")
          print("Weight entries:", sum(
              len(group["weights"])
              for group in manifest["weightsManifest"]
          ))
          print("Weight bytes:", actual)
          PY

      - name: Publish validated browser model files
        run: |
          cp build/tfjs/model.json ./model.json
          rm -f group*.bin
          cp build/tfjs/*.bin ./

      - name: Commit generated model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.json group*.bin
          if git diff --cached --quiet; then
            echo "No generated model changes to commit."
          else
            git commit -m "Rebuild validated TensorFlow.js model"
            git push
          fi
